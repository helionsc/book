<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131f25" media="(prefers-color-scheme: dark)">
<meta name="description" content="Escores clínicos, doses e fluxogramas para plantão e transporte inter-hospitalar. Funciona offline.">
<title>Escores</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS ignora o manifest para o icone da tela de inicio: usa apple-touch-icon.
     Sem transparencia e sem cantos arredondados — o sistema aplica a mascara. -->
<link rel="apple-touch-icon" sizes="180x180" href="icone-ios-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icone-ios-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icone-ios-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icone-ios-120.png">
<meta name="apple-mobile-web-app-title" content="Escores">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "default" mantem a barra de status opaca e o conteudo abaixo dela.
     black-translucent jogaria o conteudo sob o relogio. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<div id="home">
  <header>
    <div class="wrap">
      <div class="brand">
        <svg class="mk" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="13" width="5" height="7" rx="1.5" fill="#1f9d55"/>
          <rect x="9.5" y="9" width="5" height="11" rx="1.5" fill="#c77700"/>
          <rect x="17" y="4" width="5" height="16" rx="1.5" fill="#c8354b"/>
        </svg>
        <b>Escores</b>
        <button class="modo" id="tema" aria-label="Tema">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
        </button>
        <button class="modo" id="modo" aria-label="Modo ambulância" aria-pressed="false">A<sup>+</sup></button>
        <span id="rotulo-aba">Início</span>
        <span class="ver" id="ver"></span>
      </div>
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Pergunte ou busque" autocomplete="off">
        <button class="limpar" id="limpar" aria-label="Limpar busca">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button class="voz" id="voz-busca" aria-label="Buscar por voz" hidden>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
      </div>
      <div class="tags" id="tags"></div>
    </div>
  </header>
  <div class="wrap"><div id="resposta"></div><div class="list" id="list"></div></div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-top">
    <div class="wrap">
      <div class="linha1">
        <button class="back" id="back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m14 6-6 6 6 6"/></svg>Voltar
        </button>
      </div>
      <div class="trilha" id="trilha"></div>
      <h2 id="ttl"></h2>
    </div>
  </div>
  <div class="wrap"><div class="items" id="items"></div><div class="ref" id="ref"></div></div>
</div>

<div class="res" id="res">
  <div class="bar"><i id="fill"></i></div>
  <div class="wrap">
    <div class="score" id="val">—</div>
    <div class="tier"><b id="tname">—</b><span id="tnote"></span></div>
  </div>
</div>

<nav class="abas" id="abas">
  <button data-aba="tudo" aria-current="true">
    <svg width="21" height="21" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h11"/></svg>Início
  </button>
  <button data-aba="transporte">
    <svg width="21" height="21" viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>Transporte
  </button>
  <button data-aba="favoritos">
    <svg width="21" height="21" viewBox="0 0 24 24"><path d="m12 4 2.4 5 5.6.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.6-.8z"/></svg>Favoritos
  </button>
  <button data-aba="registro">
    <svg width="21" height="21" viewBox="0 0 24 24"><path d="M8 4h8a2 2 0 0 1 2 2v14l-6-3-6 3V6a2 2 0 0 1 2-2z"/></svg>Registro
    <span class="selo" id="selo-registro"></span>
  </button>
  <button data-aba="duvidas">
    <svg width="21" height="21" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-6.5A8 8 0 1 1 21 12z"/></svg>Dúvidas
    <span class="selo" id="selo-duvidas"></span>
  </button>
</nav>

<script src="resolver.js"></script>
<script src="duvidas.js"></script>
<script src="registro.js"></script>
<script src="pediatria.js"></script>
<script src="app.js"></script>
</body>
</html>
